name: Deploy Replanta Care

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-release even if tag already exists'
        required: false
        default: 'false'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PLUGIN_SLUG: replanta-care

jobs:
  lint:
    name: PHP Lint Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Lint all PHP files
        run: |
          ERRORS=0
          while IFS= read -r file; do
            if ! php -l "$file" > /dev/null 2>&1; then
              php -l "$file"
              ERRORS=$((ERRORS + 1))
            fi
          done < <(find . -name "*.php" -not -path "./.git/*" -not -path "./vendor/*")

          if [ "$ERRORS" -gt 0 ]; then
            echo "FAILED: $ERRORS PHP file(s) have syntax errors. Fix before releasing."
            exit 1
          fi

          echo "All PHP files passed lint check."

  test:
    name: PHPUnit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, bz2

      - name: Install dev dependencies
        env:
          COMPOSER_VENDOR_DIR: .vendor-dev
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit
        run: .vendor-dev/bin/phpunit --configuration phpunit.xml.dist --testdox

  deploy:
    name: Build, Release & Deploy
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: Extract version
        id: meta
        run: |
          VERSION=$(sed -nE "s/^[[:space:]]*define\([[:space:]]*'RPCARE_VERSION'[[:space:]]*,[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'[[:space:]]*\);/\1/p" replanta-care.php)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Could not extract a valid RPCARE_VERSION from replanta-care.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"

      - name: Build plugin zip
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          rm -rf /tmp/source /tmp/build /tmp/smoke
          mkdir -p /tmp/source /tmp/build/replanta-care /tmp/smoke

          # Build from the committed tree, never from mutable checkout/vendor files.
          git archive HEAD | tar -x -f - -C /tmp/source
          (cd /tmp/source && composer install \
            --no-dev --prefer-dist --no-progress --no-interaction \
            --classmap-authoritative)

          rsync -av \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.md' \
            --exclude='docs/' \
            --exclude='tests/' \
            --exclude='phpunit.xml.dist' \
            --exclude='composer.json' \
            --exclude='composer.lock' \
            --exclude='config-sample.php' \
            --exclude='update-info.json' \
            /tmp/source/ /tmp/build/replanta-care/

          cd /tmp/build
          zip -r "$GITHUB_WORKSPACE/replanta-care-${VERSION}.zip" replanta-care/
          echo "Built replanta-care-${VERSION}.zip"

      - name: Smoke release zip
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          ZIP="$GITHUB_WORKSPACE/replanta-care-${VERSION}.zip"
          test "$(unzip -Z1 "$ZIP" | head -1)" = "replanta-care/"
          if unzip -Z1 "$ZIP" | grep -Eq '/tests/|/vendor/(phpunit|myclabs|nikic|phar-io|sebastian|theseer)/'; then
            echo "FAILED: development dependencies/tests found in release ZIP"
            exit 1
          fi
          unzip -q "$ZIP" -d /tmp/smoke
          php -r "require '/tmp/smoke/replanta-care/vendor/autoload.php'; echo 'autoload OK', PHP_EOL;"
          php -l /tmp/smoke/replanta-care/replanta-care.php
          ZIP_VERSION=$(sed -nE "s/^[[:space:]]*define\([[:space:]]*'RPCARE_VERSION'[[:space:]]*,[[:space:]]*'([0-9]+\.[0-9]+\.[0-9]+)'[[:space:]]*\);/\1/p" /tmp/smoke/replanta-care/replanta-care.php)
          test "$ZIP_VERSION" = "$VERSION"

      - name: Create or update GitHub Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version }}
          name: Replanta Care v${{ steps.meta.outputs.version }}
          files: replanta-care-${{ steps.meta.outputs.version }}.zip
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZIP to License API
        env:
          API_TOKEN: ${{ secrets.REPLANTA_API_TOKEN }}
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          ZIP="${{ env.PLUGIN_SLUG }}-${VERSION}.zip"

          RESPONSE=$(curl -sS -o /tmp/upload_response.json -w "%{http_code}" \
            -X POST "https://api.replanta.net/admin/upload/care" \
            -H "X-Admin-Token: ${API_TOKEN}" \
            -F "zip=@${GITHUB_WORKSPACE}/${ZIP};type=application/zip")

          echo "Upload response HTTP $RESPONSE:"
          cat /tmp/upload_response.json

          if [ "$RESPONSE" != "201" ]; then
            echo "FAILED: Upload returned HTTP $RESPONSE"
            exit 1
          fi

      - name: Register release in License API
        env:
          API_TOKEN: ${{ secrets.REPLANTA_API_TOKEN }}
        run: |
          VERSION=${{ steps.meta.outputs.version }}
          ZIP="${{ env.PLUGIN_SLUG }}-${VERSION}.zip"

          RESPONSE=$(curl -sS -o /tmp/api_response.json -w "%{http_code}" \
            -X POST "https://api.replanta.net/admin/releases" \
            -H "X-Admin-Token: ${API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"product\":      \"care\",
              \"version\":      \"${VERSION}\",
              \"zip_filename\": \"${ZIP}\",
              \"requires_wp\":  \"6.0\",
              \"requires_php\": \"8.0\",
              \"tested_wp\":    \"7.0\",
              \"changelog\":    \"v${VERSION}\"
            }")

          echo "License API response HTTP $RESPONSE:"
          cat /tmp/api_response.json

          if [ "$RESPONSE" != "201" ] && [ "$RESPONSE" != "200" ]; then
            echo "FAILED: License API returned HTTP $RESPONSE"
            exit 1
          fi

          echo "Care v${VERSION} registered in License API"

      - name: Notify Hub to cache zip and refresh care-info.json
        env:
          REPLANTA_API_TOKEN: ${{ secrets.REPLANTA_API_TOKEN }}
        run: |
          VERSION=${{ steps.meta.outputs.version }}

          if [ -z "$REPLANTA_API_TOKEN" ]; then
            echo "ERROR: REPLANTA_API_TOKEN secret not configured"
            exit 1
          fi

          RESPONSE=$(curl -s -o /tmp/hub_response.json -w "%{http_code}" \
            -X POST "https://replanta.net/wp-json/replanta-hub/v1/deploy/care?version=${VERSION}" \
            -H "X-Deploy-Token: ${REPLANTA_API_TOKEN}" \
            --max-time 30 --retry 3 --retry-delay 5)

          echo "Hub response HTTP $RESPONSE:"
          cat /tmp/hub_response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "FAILED: Hub notification returned HTTP $RESPONSE"
            exit 1
          fi

          echo "Care v${VERSION} deployed and available to all clients"
